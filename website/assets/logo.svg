<svg width="150" height="48" viewBox="0 0 150 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-glow {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px #E8A87C); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #E8A87C); }
      100% { opacity: 0.3; filter: drop-shadow(0 0 2px #E8A87C); }
    }
    .amber-glow {
      animation: pulse-glow 3s infinite ease-in-out;
    }
  </style>

  <!-- Icon Mark -->
  <g transform="translate(-16.5, -16.5) scale(0.75)">
    <!-- Infinity loop -->
    <path d="M34,54C34,62 42,66 54,54C66,42 74,46 74,54C74,62 66,66 54,54C42,42 34,46 34,54Z"
          stroke="#F0EDE8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Loopa Amber play arrow (Animated Glow) -->
    <path class="amber-glow" d="M71,49.5L78,54L71,58.5Z" fill="#E8A87C"/>
  </g>

  <!-- Typographic Wordmark -->
  <text x="52" y="33" fill="#F0EDE8"
        font-family="'DM Sans', sans-serif"
        font-size="22" font-weight="800" letter-spacing="-0.5">loopa<tspan class="amber-glow" fill="#E8A87C">.</tspan></text>
</svg>
